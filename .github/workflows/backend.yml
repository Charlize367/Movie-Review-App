name: Deploy Node Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie_backend  
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
    - name: Login to docker hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
    - name: Build Docker Image 
      run: docker build -t charlize367/movie_backend:latest .
    - name: Publish Image to docker hub
      run: docker push charlize367/movie_backend:latest


  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull image from docker hub
        run: docker pull charlize367/movie_backend:latest
      - name: Delete old container
        run: docker rm -f movie-backend-container 
      - name: Run Docker container
        run: docker run -d -p 4000:4000 \
             --name movie-backend-container \
            -e MONGO_PASSWORD='${{ secrets.MONGO_PASSWORD}}' \
            -e DB_URI='${{ secrets.DB_URI}}' \
            -e PORT='${{ secrets.PORT }}' \
            -e NODE_ENV='production' \
            charlize367/movie_backend:latest