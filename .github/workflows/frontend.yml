
name: Deploy React Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-first-react-app  
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
    - name: Login to docker hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
    - name: Build Docker Image 
      run: docker build -t charlize367/movie_frontend:latest .
    - name: Publish Image to docker hub
      run: docker push charlize367/movie_frontend:latest


  deploy:
    needs: build
    runs-on: [self-hosted, frontend]
    steps:
      - name: Pull image from docker hub
        run: docker pull charlize367/movie_frontend:latest
      - name: Delete old container
        run: docker rm -f movie-frontend-container 
      - name: Run Docker container
        run: docker run -d -p 3000:80 --name movie-frontend-container charlize367/movie_frontend:latest